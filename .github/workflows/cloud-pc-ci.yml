name: Cloud PC build check

on:
  push:
    branches: [main]
    paths:
      - 'cloud-pc/**'
      - '.github/workflows/cloud-pc-ci.yml'
  pull_request:
    paths:
      - 'cloud-pc/**'
      - '.github/workflows/cloud-pc-ci.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud-pc
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cloud-pc/package.json
      - name: Install dependencies
        run: npm install
      - name: Build production bundle
        run: npm run build
